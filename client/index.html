<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

   <title>The Sign Pack Tools</title>
   

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <div id="app">

        <header>

            <div class="header-top">

                <div class="title-group">

                   <img src="icons/logo.svg" class="logo" alt="The Sign Pack">

                   <h1>Tools</h1>

                </div>


                <div class="toolbar">

                    <div id="reload" title="Check for updates and reload">↻</div>

                </div>

            </div>
			


            <div class="version-row">

                <small id="plugin-version"></small>

                <small id="update-state"></small>

            </div>


            <div class="search-container">

                <input
                    type="text"
                    id="search"
                    placeholder="Search tools..."
                >

                <img
                    src="icons/search.svg"
                    class="search-icon"
                    alt=""
                >

            </div>

        </header>


        <div id="accordion"></div>


        <div id="updateBar" class="hidden">

            <div class="update-text" id="updateText"></div>

            <div class="update-track">
                <div class="update-fill" id="updateFill"></div>
            </div>

        </div>


        <div
            id="statusBar"
            class="status info"
        >
        </div>

    </div>


    <!-- ========================================== -->
    <!-- ADOBE CEP INTERFACE                        -->
    <!-- ========================================== -->

    <script src="js/CSInterface.js"></script>


    <!-- ========================================== -->
    <!-- ILLUSTRATOR COMMUNICATION                  -->
    <!-- ========================================== -->

    <script src="js/illustrator.js"></script>


    <!-- ========================================== -->
    <!-- LOGGING                                    -->
    <!-- ========================================== -->

    <script src="js/logger.js"></script>


    <!-- ========================================== -->
    <!-- CACHE                                      -->
    <!-- ========================================== -->

    <script src="js/cache.js"></script>


    <!-- ========================================== -->
    <!-- DYNAMIC LIBRARY LOADER                     -->
    <!-- ========================================== -->

    <script src="js/loader.js"></script>


    <!-- ========================================== -->
    <!-- LOCAL CONFIGURATION (GITHUB ACCESS)        -->
    <!-- ========================================== -->

    <script src="js/config.js"></script>


    <!-- ========================================== -->
    <!-- LIBRARY MANAGEMENT                         -->
    <!-- ========================================== -->

    <script src="js/library.js"></script>


    <!-- ========================================== -->
    <!-- USER INTERFACE                             -->
    <!-- ========================================== -->

    <script src="js/ui.js"></script>


    <!-- ========================================== -->
    <!-- APPLICATION                                -->
    <!-- ========================================== -->

    <script src="js/app.js"></script>

</body>

</html>
